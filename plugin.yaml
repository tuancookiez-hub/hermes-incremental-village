name: hermes-village
version: 0.13.0
description: >-
  Hermes Incremental Village: three castaways grow into a city of thousands, in Hermes Desktop.
  Hermes plays the named villagers; you are their guide, not their god. Each villager follows a way
  of life for free, the folk around them multiply as homes and food allow, and every tree they fell
  is a real tile. A technology tree of 19 ideas runs from fishing to flight. It keeps playing while
  you are away. Model calls happen only when you ask for a council (one batched call) and stop at a
  daily token budget you set. Nothing is downloaded and nothing runs in the background.
author: tuancookiez
license: MIT
requires_hermes: ">=0.22.7"
provides_tools:
  - village_status
  - village_guide
  - village_habit_day
  - village_plan_day
tags: [game, desktop, three.js, simulation]
