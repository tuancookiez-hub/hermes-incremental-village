# Builds the optional Rust engine for each platform when a version tag is pushed, tests it against the
# built-in Python rules, attests every build and publishes them on the release. The plugin never
# downloads these: it runs on the Python rules unless you install the Rust engine yourself.
name: Build engine

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ext: .exe, check: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64, ext: "", check: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64, ext: "", check: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, ext: "", check: true }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, ext: "", check: false } # cross-built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the engine version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine-rs/Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Add the target
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *musl ]]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi

      - name: Build
        working-directory: engine-rs
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the build
        shell: bash
        run: |
          mkdir dist
          cp "engine-rs/target/${{ matrix.target }}/release/hermes-village-engine${{ matrix.ext }}" \
             "dist/hermes-village-engine-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.check
        with:
          python-version: "3.13"

      # The port is held to the frozen Python engine, so this also proves the rules on this platform.
      - name: Test this build
        if: matrix.check
        shell: bash
        run: |
          cargo test --release --locked --target "${{ matrix.target }}" --manifest-path engine-rs/Cargo.toml
          python -m pip install pytest
          HERMES_VILLAGE_ENGINE="$PWD/dist/hermes-village-engine-${VERSION}-${{ matrix.name }}${{ matrix.ext }}" python -m pytest tests -q
          HERMES_VILLAGE_BACKEND=python python -m pytest tests/test_village.py tests/test_backends.py -q

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum hermes-village-engine-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Optional Rust engine builds for Hermes Incremental Village. The plugin works without them." hermes-village-engine-* SHA256SUMS
