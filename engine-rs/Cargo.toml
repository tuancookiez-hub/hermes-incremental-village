[package]
name = "hermes-village-engine"
version = "0.12.0"
edition = "2021"
description = "Deterministic rules engine for the Hermes Incremental Village plugin (exact port of village/engine.py)"
license = "MIT"
publish = false

[[bin]]
name = "hermes-village-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
